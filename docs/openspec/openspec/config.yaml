schema: spec-driven

context: |
  Product: Quintara, a free local open-source A-share research and weekly model-ranking application.
  Owner requirements: ../../REQUIREMENTS_GRILL.md, with later CONFIRMED/SUPERSEDED decisions taking precedence.
  Kernel authority: /home/olm/bigdata/bigdata/app.
  Platforms: Windows 11 x86-64 guaranteed, Windows 10 22H2 best-effort; Ubuntu 22.04/24.04 and Debian 12/13 x86-64.
  UI: standalone Chinese PySide6/Qt Widgets desktop GUI; no WebUI or HTTP server. A plain shell CLI covers headless Linux.
  Runtime: Python 3.12, LightGBM; CPU is authoritative, GPU is explicitly experimental after capability probing.
  Data: users download BaoStock data locally; no bundled market dataset and no telemetry. User CSV is validated, never silently cleaned.
  Model identities: PIT CSI300 baseline, custom static A-share universe, and explicit NON_PIT_FALLBACK must never share models, manifests, results, or history.
  Default Quintara label: close(T+5) / open(T+1) - 1 over actual trading days. Preserve the original competition open/open contract as an internal differential fixture, not the default product result.
  Portfolio: five unique stocks with fixed rank weights 0.40, 0.25, 0.15, 0.12, 0.08.
  Safety and privacy: research language only, local-only diagnostics, no automatic screenshots, no brokerage integration or automated trading.
  Quality: stable release is blocked by any failed core Windows/Linux install, data, CPU train/predict, recovery, differential, unit, property, GUI, or CLI acceptance test.

rules:
  proposal:
    - Include explicit goals, non-goals, capability list, compatibility impact, and success gates.
    - Cite the relevant C-xxx/Txx/UIxx/Fxx owner requirement identifiers without copying the grill verbatim.
  specs:
    - Use normative SHALL requirements and at least one WHEN/THEN scenario for every requirement.
    - Give requirements stable capability-local IDs in bold at the start of each requirement statement.
    - Include failure, cancellation, provenance, and cross-platform scenarios where applicable.
    - Never use current static CSI300 constituents as if they were historical PIT membership.
    - Explicitly identify whether behavior belongs to PIT_BASELINE, CUSTOM_UNIVERSE, or NON_PIT_FALLBACK.
  design:
    - Include architecture, component boundaries, state machines, storage layout, manifest identities, platform adaptation, failure recovery, and test strategy.
    - Record the original competition-label versus Quintara product-label decision as a versioned kernel boundary.
  tasks:
    - Organize tasks into dependency-ordered milestones with test and documentation work adjacent to implementation.
    - Include Windows and Linux packaging, automated acceptance evidence, licensing, and legal-document review.
    - Do not mark implementation tasks complete in planning artifacts.

operations:
  apply:
    guidance:
      - Preserve atomic publication and fail-closed data/model identity checks.
      - Keep GUI, CLI, and background jobs as adapters over one application service.
  archive:
    guidance:
      - Sync every validated capability spec before archiving the initial product change.
