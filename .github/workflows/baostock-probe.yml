name: BaoStock protocol probe

on:
  schedule:
    - cron: "17 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.7" }
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run python packaging/baostock_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: baostock-probe-${{ github.run_id }}
          path: dist/baostock-probe.json
          if-no-files-found: warn
