name: Package smoke

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linux:
    name: Linux package smoke
    # Build the distributable on the oldest supported glibc builder.  A bundle
    # built on ubuntu-latest can embed a newer libpython and fail on Debian 12.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install Qt runtime libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - name: Install OpenSpec validator
        run: npm install --global @fission-ai/openspec@1.9.0
      - run: uv build
      - run: uv run pytest -q --junitxml=dist/pytest.xml
      - run: QT_QPA_PLATFORM=offscreen uv run python packaging/linux_user_journey.py
      - run: QT_QPA_PLATFORM=offscreen uv run python packaging/baostock_gui_journey.py
      - run: uv run python packaging/performance_evidence.py
      - run: uv run python packaging/production_scale_benchmark.py
      - run: QT_QPA_PLATFORM=offscreen uv run python packaging/visual_matrix.py
      - run: uv run python packaging/single_instance_smoke.py
      - run: uv run python packaging/build_release.py
      - name: Stage developer data beside Linux bundles
        run: |
          mkdir -p dist/data/developer
          cp packaging/developer_data/quintara-developer-data-v1.zip packaging/developer_data/README.txt dist/data/developer/
      - run: uv run python packaging/elf_compat_audit.py --max-glibc 2.35
      - run: uv run python packaging/sbom.py
      - run: uv run python packaging/icon_release_audit.py
      - run: uv run python packaging/legal_review.py
      - run: uv run python packaging/openspec_audit.py
      - run: QT_QPA_PLATFORM=offscreen uv run python packaging/test_matrix.py --skip-visual --skip-benchmark
      - run: uv run python packaging/candidate_gate.py
      - run: uv run python packaging/release_evidence.py
      - run: QUINTARA_PREFIX="$RUNNER_TEMP/quintara-prefix" ./packaging/install_linux.sh
      - run: "$RUNNER_TEMP/quintara-prefix/bin/quintara-cli --version"
      - run: "$RUNNER_TEMP/quintara-prefix/bin/quintara-cli doctor --root $RUNNER_TEMP/quintara-bundle"
      - run: QT_QPA_PLATFORM=offscreen timeout 15 "$RUNNER_TEMP/quintara-prefix/bin/quintara" || test $? -eq 124
      - run: uv venv /tmp/quintara-wheel-smoke
      - run: uv pip install --python /tmp/quintara-wheel-smoke/bin/python dist/*.whl
      - run: /tmp/quintara-wheel-smoke/bin/quintara --version
      - run: QT_QPA_PLATFORM=offscreen timeout 15 /tmp/quintara-wheel-smoke/bin/quintara-gui || test $? -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: quintara-linux-${{ github.sha }}
          path: dist/

  windows:
    name: Windows installer smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - name: Install OpenSpec validator
        run: npm install --global @fission-ai/openspec@1.9.0
      - run: uv build
      - run: uv run pytest -q --junitxml=dist/pytest.xml
      - run: uv run python packaging/baostock_gui_journey.py
      - run: uv run python packaging/build_release.py
      - name: Stage developer data beside Windows bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/data/developer | Out-Null
          Copy-Item packaging/developer_data/quintara-developer-data-v1.zip,packaging/developer_data/README.txt dist/data/developer/
      - run: uv run python -c "import json; a=json.load(open('dist/build-metadata.json'))['artifacts']; assert {'Quintara.exe','quintara-cli.exe'} <= set(a)"
      - run: uv run python packaging/sbom.py
      - run: uv run python packaging/icon_release_audit.py
      - run: uv run python packaging/legal_review.py
      - run: uv run python packaging/openspec_audit.py
      - run: uv run python packaging/candidate_gate.py
      # install_smoke exercises the installed CLI version/doctor and the GUI
      # process boundary in one clean-user-directory flow.
      - run: .\packaging\windows\smoke.ps1
      - run: choco install innosetup --yes --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\Quintara.iss'
      - run: .\packaging\windows\install_smoke.ps1
      - run: uv run python packaging/release_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: quintara-windows-${{ github.sha }}
          path: dist/

  release-assets:
    name: Publish release assets
    if: github.event_name == 'release'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: quintara-*-${{ github.sha }}
          path: artifacts
      - name: Prepare stable download names
        run: |
          set -euo pipefail
          mkdir release
          cp artifacts/quintara-windows-${GITHUB_SHA}/installer/Quintara-*-windows-x64.exe \
            release/Quintara-Windows-x64-Setup.exe
          mkdir -p portable/data/developer
          cp "artifacts/quintara-windows-${GITHUB_SHA}/Quintara.exe" portable/Quintara.exe
          cp artifacts/quintara-windows-${GITHUB_SHA}/data/developer/* portable/data/developer/
          (cd portable && zip -qr ../release/Quintara-Windows-x64-Portable.zip .)
          tar -C "artifacts/quintara-linux-${GITHUB_SHA}" -czf \
            release/Quintara-Linux-x86_64.tar.gz Quintara quintara-cli data/developer
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
